<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MW Date Extractor</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Tiro+Bangla&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #2a2a3a;
      --accent: #c026d3;
      --accent2: #7c3aed;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --success: #10b981;
      --error: #ef4444;
      --mono: 'JetBrains Mono', monospace;
      --serif: 'Tiro Bangla', serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
      position: relative;
      overflow-x: hidden;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(192,38,211,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(192,38,211,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Glow orbs */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(192,38,211,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 760px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(192,38,211,0.1);
      border: 1px solid rgba(192,38,211,0.3);
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    h1 {
      font-size: clamp(26px, 5vw, 42px);
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 30%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .subtitle {
      font-family: var(--serif);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .card-label {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    textarea {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 14px;
      resize: vertical;
      min-height: 160px;
      transition: border-color 0.2s;
      outline: none;
      line-height: 1.6;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(192,38,211,0.1);
    }

    textarea::placeholder { color: var(--muted); }

    /* Controls */
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      letter-spacing: 0.02em;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 4px 20px rgba(192,38,211,0.3);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(192,38,211,0.45);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    /* Status */
    .status {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 14px;
      border: 1px solid;
    }

    .status.loading {
      display: flex;
      background: rgba(124,58,237,0.1);
      border-color: rgba(124,58,237,0.3);
      color: #a78bfa;
    }

    .status.success {
      display: flex;
      background: rgba(16,185,129,0.08);
      border-color: rgba(16,185,129,0.25);
      color: var(--success);
    }

    .status.error {
      display: flex;
      background: rgba(239,68,68,0.08);
      border-color: rgba(239,68,68,0.25);
      color: var(--error);
    }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(167,139,250,0.3);
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Result */
    .result-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .result-card.visible { display: block; }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.2);
    }

    .result-title {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--success);
    }

    .result-body {
      padding: 24px;
    }

    /* Date grid */
    .date-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .date-item {
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      transition: border-color 0.2s, transform 0.2s;
      animation: fadeIn 0.3s ease both;
    }

    .date-item:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .date-label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .date-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .date-value.accent { color: var(--accent); }
    .date-value.success { color: var(--success); }

    /* Raw response */
    .raw-toggle {
      font-size: 11px;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-family: var(--mono);
      letter-spacing: 0.05em;
      text-decoration: underline;
      margin-top: 8px;
    }

    .raw-toggle:hover { color: var(--text); }

    .raw-box {
      display: none;
      margin-top: 16px;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font-size: 12px;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 300px;
      overflow-y: auto;
      line-height: 1.7;
    }

    .raw-box.open { display: block; }

    /* Footer */
    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    footer span { color: var(--accent); }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="badge">Cloudflare Worker Powered</div>
    <h1>MW Date Extractor</h1>
    <p class="subtitle">টেক্সট থেকে তারিখ বের করে বাংলায় রূপান্তর করুন</p>
  </header>

  <!-- Input Card -->
  <div class="card">
    <div class="card-label">// Input Text</div>
    <textarea id="inputText" placeholder="এখানে টেক্সট পেস্ট করুন যেখানে তারিখ আছে...&#10;&#10;উদাহরণ: The event was held on 15 March 2024 and the next meeting is on 2025-06-30."></textarea>

    <div class="controls">
      <button class="btn btn-primary" id="extractBtn" onclick="extractDates()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        তারিখ বের করুন
      </button>
      <button class="btn btn-secondary" onclick="clearAll()">পরিষ্কার করুন</button>
    </div>

    <div class="status" id="status">
      <div class="spinner"></div>
      <span id="statusText">AI বিশ্লেষণ করছে...</span>
    </div>
  </div>

  <!-- Result Card -->
  <div class="result-card" id="resultCard">
    <div class="result-header">
      <span class="result-title">✓ তারিখ পাওয়া গেছে</span>
      <button class="btn btn-secondary" style="padding:6px 14px;font-size:12px;" onclick="copyResult()">কপি করুন</button>
    </div>
    <div class="result-body">
      <div class="date-grid" id="dateGrid"></div>
      <button class="raw-toggle" onclick="toggleRaw()">সম্পূর্ণ AI রেসপন্স দেখুন ▾</button>
      <div class="raw-box" id="rawBox"></div>
    </div>
  </div>

  <footer>Powered by <span>Cloudflare Workers</span> · Claude AI · MW Date Extractor</footer>
</div>

<script>
  const WORKER_URL = 'https://mw-date-extractor.alifmondol2030.workers.dev';

  async function extractDates() {
    const text = document.getElementById('inputText').value.trim();
    if (!text) { showStatus('error', '⚠ কোনো টেক্সট নেই। আগে টেক্সট লিখুন।'); return; }

    const btn = document.getElementById('extractBtn');
    btn.disabled = true;
    document.getElementById('resultCard').classList.remove('visible');
    showStatus('loading', 'AI বিশ্লেষণ করছে...');

    const prompt = `Extract all dates from the following text. For each date found:
1. Write the original date as it appears
2. Convert it to Bengali format (বাংলা তারিখ: DD মাসের নাম YYYY)
3. Also provide ISO format (YYYY-MM-DD)

Respond in this exact JSON format:
{
  "found": true/false,
  "count": number,
  "dates": [
    {
      "original": "original date text",
      "bengali": "বাংলা ফরম্যাট",
      "iso": "YYYY-MM-DD",
      "context": "short surrounding context"
    }
  ],
  "summary": "brief Bengali summary"
}

Text to analyze:
${text}`;

    try {
      const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`Worker error ${response.status}: ${errText}`);
      }

      const data = await response.json();

      // Extract text from Claude response
      let rawText = '';
      if (data.content && Array.isArray(data.content)) {
        rawText = data.content.map(b => b.text || '').join('');
      } else if (typeof data === 'string') {
        rawText = data;
      } else if (data.text) {
        rawText = data.text;
      } else {
        rawText = JSON.stringify(data);
      }

      // Try to parse JSON from response
      let parsed = null;
      try {
        const jsonMatch = rawText.match(/\{[\s\S]*\}/);
        if (jsonMatch) parsed = JSON.parse(jsonMatch[0]);
      } catch (e) { /* fallback to raw display */ }

      showStatus('success', '✓ বিশ্লেষণ সম্পন্ন!');
      renderResult(parsed, rawText);

    } catch (err) {
      showStatus('error', '✗ Error: ' + err.message);
      console.error(err);
    } finally {
      btn.disabled = false;
    }
  }

  function renderResult(parsed, raw) {
    const card = document.getElementById('resultCard');
    const grid = document.getElementById('dateGrid');
    const rawBox = document.getElementById('rawBox');

    grid.innerHTML = '';
    rawBox.textContent = raw;
    rawBox.classList.remove('open');

    if (parsed && parsed.found && parsed.dates && parsed.dates.length > 0) {
      parsed.dates.forEach((d, i) => {
        const delay = i * 60;
        grid.innerHTML += `
          <div class="date-item" style="animation-delay:${delay}ms">
            <div class="date-label">তারিখ ${i + 1} · মূল</div>
            <div class="date-value accent">${d.original || '—'}</div>
            <div class="date-label" style="margin-top:10px">বাংলা</div>
            <div class="date-value">${d.bengali || '—'}</div>
            <div class="date-label" style="margin-top:10px">ISO ফরম্যাট</div>
            <div class="date-value success" style="font-size:13px">${d.iso || '—'}</div>
            ${d.context ? `<div class="date-label" style="margin-top:10px;font-size:9px;color:#4b4b60">${d.context}</div>` : ''}
          </div>`;
      });

      if (parsed.summary) {
        grid.innerHTML += `
          <div class="date-item" style="grid-column:1/-1;animation-delay:${parsed.dates.length * 60}ms;border-color:rgba(192,38,211,0.3)">
            <div class="date-label">সারসংক্ষেপ</div>
            <div style="font-family:'Tiro Bangla',serif;font-size:14px;color:#c4c4d4;line-height:1.7">${parsed.summary}</div>
          </div>`;
      }
    } else if (parsed && !parsed.found) {
      grid.innerHTML = `<div class="date-item" style="grid-column:1/-1;text-align:center;padding:30px">
        <div style="font-size:32px;margin-bottom:10px">📭</div>
        <div class="date-value" style="color:var(--muted)">কোনো তারিখ পাওয়া যায়নি</div>
        <div style="font-size:12px;color:var(--muted);margin-top:6px">${parsed.summary || ''}</div>
      </div>`;
    } else {
      // fallback: show raw only
      grid.innerHTML = `<div class="date-item" style="grid-column:1/-1">
        <div class="date-label">AI রেসপন্স</div>
        <div style="font-size:13px;line-height:1.7;color:#c4c4d4;white-space:pre-wrap">${raw}</div>
      </div>`;
    }

    card.classList.add('visible');
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function showStatus(type, msg) {
    const el = document.getElementById('status');
    el.className = 'status ' + type;
    document.getElementById('statusText').textContent = msg;
    if (type !== 'loading') {
      const spinner = el.querySelector('.spinner');
      if (spinner) spinner.style.display = 'none';
    }
  }

  function toggleRaw() {
    const box = document.getElementById('rawBox');
    box.classList.toggle('open');
    document.querySelector('.raw-toggle').textContent =
      box.classList.contains('open') ? 'লুকান ▴' : 'সম্পূর্ণ AI রেসপন্স দেখুন ▾';
  }

  function clearAll() {
    document.getElementById('inputText').value = '';
    document.getElementById('resultCard').classList.remove('visible');
    document.getElementById('status').className = 'status';
    document.getElementById('extractBtn').disabled = false;
  }

  function copyResult() {
    const items = document.querySelectorAll('.date-item');
    let text = 'MW Date Extractor - ফলাফল\n\n';
    items.forEach(item => { text += item.innerText + '\n---\n'; });
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('.result-header .btn-secondary');
      btn.textContent = '✓ কপি হয়েছে!';
      setTimeout(() => btn.textContent = 'কপি করুন', 2000);
    });
  }
</script>
</body>
</html>
